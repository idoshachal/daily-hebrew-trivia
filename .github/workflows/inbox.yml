name: Move question to private inbox

on:
  issues:
    types: [opened]

jobs:
  move:
    if: startsWith(github.event.issue.title, 'שאלה מאת ')
    runs-on: ubuntu-latest
    steps:
      - name: Save privately and remove the public copy
        env:
          GH_TOKEN: ${{ secrets.INBOX_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          with open("body.txt", "w", encoding="utf-8") as handle:
              handle.write(os.environ.get("BODY") or "")
          subprocess.check_call([
              "gh", "issue", "create",
              "--repo", "idoshachal/trivia-inbox",
              "--title", os.environ["TITLE"],
              "--body-file", "body.txt",
          ])
          subprocess.check_call([
              "gh", "issue", "delete", os.environ["NUMBER"],
              "--repo", "idoshachal/daily-hebrew-trivia",
              "--yes",
          ])
          PY
