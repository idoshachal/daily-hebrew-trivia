name: Move question to private inbox

on:
  issues:
    types: [opened]

jobs:
  move:
    if: startsWith(github.event.issue.title, 'שאלה מאת ')
    runs-on: ubuntu-latest
    steps:
      - name: Save privately and remove the public copy
        env:
          GH_TOKEN: ${{ secrets.INBOX_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          token = os.environ["GH_TOKEN"]
          print("len", len(token))
          print("sha", hashlib.sha256(token.encode()).hexdigest()[:12])
          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "trivia-inbox",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      response.read()
              except urllib.error.HTTPError as error:
                  print(error.code)
                  print(error.read().decode()[:300])
                  raise
          call(
              "POST",
              "https://api.github.com/repos/idoshachal/trivia-inbox/issues",
              {"title": os.environ["TITLE"], "body": os.environ.get("BODY") or ""},
          )
          call(
              "DELETE",
              f"https://api.github.com/repos/idoshachal/daily-hebrew-trivia/issues/{os.environ['NUMBER']}",
          )
          PY
