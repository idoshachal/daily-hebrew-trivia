name: Move question to private inbox

on:
  issues:
    types: [opened]

jobs:
  move:
    if: startsWith(github.event.issue.title, 'שאלה מאת ')
    runs-on: ubuntu-latest
    steps:
      - name: Save privately and remove the public copy
        env:
          GH_TOKEN: ${{ secrets.INBOX_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api user --jq .login
          gh api repos/idoshachal/trivia-inbox --jq .visibility
          gh issue create --repo idoshachal/trivia-inbox --title "$TITLE" --body "$BODY"
          gh issue delete "$NUMBER" --repo idoshachal/daily-hebrew-trivia --yes
